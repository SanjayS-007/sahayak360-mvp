services:
  - type: web
    name: sahayak360-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sahayak360-postgres
          property: connectionString
      - key: NEO4J_URI
        value: bolt://localhost:7687
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        value: neo4j_dev_2026
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: https://sahayak360.vercel.app,http://localhost:3000

databases:
  - name: sahayak360-postgres
    databaseName: sahayak360
    user: sahayak
    plan: free
